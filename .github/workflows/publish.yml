name: Publish To Maven
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./gradlew build publish
        env:
          MAVEN_NAME: ${{ secrets.MAVEN_NAME }}
          MAVEN_SECRET: ${{ secrets.MAVEN_SECRET }}

      - name: Upload Fabric
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 6nKmUVc7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ github.workspace }}/fabric/build/libs/protoweaver-fabric-${{ github.event.release.tag_name }}.jar
          java: 21
          loaders: |
            fabric
            quilt
          game-versions: |
            >=1.14

      - name: Upload Forge
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 6nKmUVc7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ github.workspace }}/forge/build/libs/protoweaver-forge-${{ github.event.release.tag_name }}.jar
          java: 21
          loaders: forge
          game-versions: |
            >=1.15

      - name: Upload NeoForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 6nKmUVc7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ github.workspace }}/neoforge/build/libs/protoweaver-neoforge-${{ github.event.release.tag_name }}.jar
          java: 21
          loaders: neoforge
          game-versions: |
            >=1.20.2

      - name: Upload Paper
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 6nKmUVc7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ github.workspace }}/paper/build/libs/protoweaver-paper-${{ github.event.release.tag_name }}.jar
          java: 21
          loaders: |
            paper
            folia
            purpur
          game-versions: |
            >=1.14

      - name: Upload Proxy
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: 6nKmUVc7
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ github.workspace }}/proxy/build/libs/protoweaver-proxy-${{ github.event.release.tag_name }}.jar
          java: 21
          loaders: |
            velocity
            waterfall
          game-versions: |
            >=1.14